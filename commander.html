<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander — e-CHIPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#D2101F;--red-deep:#9E0B16;--yellow:#F7C325;--cream:#FFF4DC;--ink:#1B1210}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#FDF3E9;color:var(--ink);font-family:'Outfit',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 88% 18%,#F9EBD0 0 15vmax,transparent 15.1vmax),radial-gradient(circle at 8% 92%,#F9EBD0 0 11vmax,transparent 11.1vmax),radial-gradient(60vmax 50vmax at 55% 50%,rgba(255,255,255,.7),rgba(255,255,255,0) 65%)}
#marquee{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;flex-direction:column;justify-content:center;gap:3vh;overflow:hidden}
.mq{white-space:nowrap;font-family:'Anton',sans-serif;font-size:24vh;line-height:1;text-transform:uppercase;color:transparent;-webkit-text-stroke:2px #D2101F;opacity:.09;will-change:transform}
.mq.solid{color:#D2101F;-webkit-text-stroke:0;opacity:.04}
#gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none;display:block}

nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,48px);pointer-events:none}
nav>*{pointer-events:auto}
.logo img{height:58px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));transition:transform .3s}
.logo:hover img{transform:rotate(-3deg) scale(1.05)}
.nav-r{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;background:var(--yellow);color:var(--ink);border:0;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:transform .25s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.cart-btn{position:relative}
.cart-btn .count{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center;padding:0 6px}
.cart-btn svg{width:20px;height:20px}

.intro{position:fixed;left:clamp(20px,6vw,96px);top:16vh;z-index:3;max-width:min(30vw,440px);pointer-events:none}
.eyebrow{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:14px;color:#B8352F;margin:0 0 16px}
h1{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;margin:0;line-height:.92;color:var(--red);font-size:clamp(46px,5.6vw,92px)}
.hint{margin:18px 0 0;font-size:16px;color:#6b5a55;display:flex;align-items:center;gap:10px}
.hint svg{width:22px;height:22px;flex:none}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.04em}.w>span{display:inline-block}

#field{position:relative;z-index:2;height:100vh;width:100%;overflow:hidden}
.prod{position:absolute;border:0;background:none;padding:0;cursor:grab;touch-action:none;outline-offset:8px;border-radius:20px}
.prod:active{cursor:grabbing}
.prod:focus-visible{outline:3px solid var(--yellow)}
.float,.tilt{display:block;position:relative}
.tilt{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.prod img{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 26px rgba(120,60,30,.28));pointer-events:none;user-select:none;-webkit-user-drag:none}
.label{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%) rotate(var(--lr,-4deg));background:#fff;border:1px solid #F1E2D2;color:var(--ink);border-radius:14px;padding:8px 14px;white-space:nowrap;text-align:left;box-shadow:0 12px 26px rgba(0,0,0,.22);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.label b{display:block;font-size:15px;font-weight:800;line-height:1.15}
.label span{font-size:13px;color:#7a6a64}
.label i{font-style:normal;font-family:'Anton',sans-serif;font-size:18px;color:var(--red);margin-left:8px}
.prod:hover .label,.prod:focus-visible .label{transform:translateX(-50%) rotate(0deg) scale(1.08)}

/* drawer */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(27,18,16,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(460px,100vw);background:var(--cream);color:var(--ink);transform:translateX(105%);transition:transform .55s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px rgba(0,0,0,.25)}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px}
.d-head h2{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:30px;margin:0;color:var(--red)}
.x{width:44px;height:44px;border-radius:999px;border:0;background:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.x svg{width:20px;height:20px}
.d-body{flex:1;overflow:auto;padding:0 24px 24px}
.pv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.pv .stage{width:100%;height:300px;display:grid;place-items:center;border-radius:24px;margin-bottom:10px}
.pv .stage img{max-height:270px;max-width:80%;filter:drop-shadow(0 24px 24px rgba(0,0,0,.3));transform:rotate(-6deg)}
.pv h3{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:34px;margin:6px 0 0;line-height:1}
.pv .fmt{color:#6b5a55;margin:0}
.pv .price{font-family:'Anton',sans-serif;font-size:40px;color:var(--red);margin:6px 0 10px}
.qty{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.qty button{width:40px;height:40px;border-radius:999px;border:0;background:var(--cream);cursor:pointer;font-size:22px;font-weight:700;color:var(--ink)}
.qty output{min-width:34px;text-align:center;font-weight:800;font-size:18px}
.d-foot{padding:18px 24px 24px;border-top:1px solid #EADBC8;display:flex;flex-direction:column;gap:10px}
.d-foot .btn{width:100%}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px}
.total b{font-family:'Anton',sans-serif;font-weight:400;font-size:30px;color:var(--red)}
.line{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #EADBC8}
.line img{width:58px;height:72px;object-fit:contain;transform:rotate(-6deg)}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-size:16px}
.line .info span{font-size:14px;color:#6b5a55}
.line .qty button{width:32px;height:32px;font-size:18px}
.empty{text-align:center;color:#6b5a55;padding:40px 0}
.note{font-size:13px;color:#6b5a55;text-align:center;margin:0}
.toast{white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:28px;z-index:50;transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:999px;font-weight:600;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.toast{visibility:hidden}.toast.on{transform:translate(-50%,0);visibility:visible}

@media (max-width:820px), (max-aspect-ratio:9/10){
  .intro{position:absolute;top:12vh;max-width:none;right:20px}
  h1{font-size:clamp(40px,12vw,64px)}
  .hint{font-size:14px}
  #field{height:240vh}
  .logo img{height:42px}
  nav .btn{min-height:44px;padding:0 16px;font-size:14px}
  .label b{font-size:13px}.label span{font-size:12px}.label i{font-size:15px}
}
@media (orientation:landscape) and (max-height:540px){
  .intro{top:70px}.hint{display:none}h1{font-size:clamp(30px,5vw,48px)}
  .logo img{height:34px}
}
@media (min-width:1800px) and (min-aspect-ratio:9/10){
  .logo img{height:3.4vw}
  .btn{min-height:2.8vw;padding:0 1.4vw;font-size:.95vw}
  .eyebrow{font-size:.8vw}.hint{font-size:1vw}
  .intro{max-width:26vw}
  .label{padding:.5vw .9vw;border-radius:.9vw}.label b{font-size:.95vw}.label span{font-size:.8vw}.label i{font-size:1.1vw}
  .drawer{width:28vw}
}
@media (prefers-reduced-motion:reduce){.tilt,.label,.drawer{transition:none}}

/* ===== responsive+ ===== */
html{-webkit-text-size-adjust:100%}
@supports (height:100svh){ #field{height:100svh} }
nav{padding-top:max(18px,env(safe-area-inset-top));padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right))}
.btn{touch-action:manipulation}
@media (hover:none){.btn:hover,.logo:hover img,.prod:hover .label{transform:none}.prod:hover .label{transform:translateX(-50%) rotate(var(--lr,-4deg))}}
.d-head{padding-top:max(20px,env(safe-area-inset-top))}
.d-foot{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.toast{bottom:max(28px,calc(env(safe-area-inset-bottom) + 16px))}
.drawer{max-width:100vw}
.d-body{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.line{flex-wrap:wrap}
@media (max-width:820px), (max-aspect-ratio:9/10){
  @supports (height:100svh){ #field{height:240svh} }
  .intro{left:max(20px,env(safe-area-inset-left));right:max(20px,env(safe-area-inset-right))}
  .nav-r{gap:6px}
  .d-head h2{font-size:26px}
  .pv .stage{height:min(300px,38svh)}.pv .stage img{max-height:min(270px,34svh)}
  .pv h3{font-size:28px}.pv .price{font-size:34px}
}
@media (max-width:420px){
  nav .btn.ghost{display:none}
  .cart-btn span:not(.count){display:inline}
  .label{padding:6px 10px}
  .eyebrow{font-size:12px}
}
@media (orientation:landscape) and (max-height:540px){
  .pv .stage{height:34svh}.pv .stage img{max-height:30svh}
  .d-head{padding:10px 20px}.d-foot{padding:10px 20px}
}

/* ===== commande ===== */
.ck{display:flex;flex-direction:column;gap:16px;position:relative}
.f{display:flex;flex-direction:column;gap:6px}
.f>span{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#6b5a55}
.f input{width:100%;height:50px;border-radius:14px;border:2px solid #EADBC8;background:#fff;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.f input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(210,16,31,.12)}
.locrow{display:flex;gap:8px}
.locbtn{flex:none;width:50px;height:50px;border-radius:14px;border:2px solid #EADBC8;background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--red)}
.locbtn:hover{border-color:var(--red)}.locbtn svg{width:22px;height:22px}
.hint2{min-height:18px;color:#6b5a55;font-size:13px}
.sum{list-style:none;margin:4px 0 0;padding:12px 0 0;border-top:1px solid #EADBC8;display:flex;flex-direction:column;gap:8px;font-size:15px}
.sum li{display:flex;justify-content:space-between;gap:12px}.sum b{font-variant-numeric:tabular-nums;white-space:nowrap}
.err{margin:0;padding:12px 14px;border-radius:12px;background:#FDE3E1;color:#9E0B16;font-weight:600;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
</style>
</head>

<script>
(function () {
  const gsap = window.gsap; gsap.registerPlugin(window.Draggable, window.ScrollTrigger);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STACK = '(max-width: 820px), (max-aspect-ratio: 9/10)';
  const PHONE = '+225 05 00 23 40 40', WA = '2250500234040';
  const fmt = n => n.toLocaleString('fr-FR').replace(/ | /g, ' ') + ' FCFA';
  const field = document.getElementById('field');
  const P = window.PRODUCTS;

  /* scattered layouts: [left %, top %, rotation, width (vw desktop / vw mobile), depth, label tilt] */
  const DESK = {
    'banane-mure':  [38, 20, -9, 15, 1.0, -5],
    'kilichi':      [68, 9, 11, 10.5, .8, 4],
    'mangues':      [9, 54, 14, 10, .55, -3],
    'banane-verte': [54, 52, -7, 11.5, .9, 5],
    'manioc':       [80, 50, -16, 10, .7, -6],
    'patate':       [27, 64, 18, 9.5, .5, 3]
  };
  const MOB = {
    'banane-mure':  [34, 17, -8, 42, 1.0, -4],
    'kilichi':      [58, 27, 12, 34, .8, 5],
    'mangues':      [6, 36, -14, 34, .6, -3],
    'banane-verte': [44, 49, 7, 38, .9, 4],
    'manioc':       [5, 63, 15, 34, .7, -5],
    'patate':       [52, 75, -11, 34, .6, 3]
  };

  /* build */
  const els = P.map(p => {
    const b = document.createElement('button');
    b.className = 'prod'; b.type = 'button';
    b.setAttribute('aria-label', `${p.name}, ${p.pack}, ${fmt(p.price)}. Commander`);
    b.innerHTML = `<span class="float"><span class="tilt"><img alt="" src="${p.img}"><span class="label"><b>${p.name}</b><span>${p.pack}</span><i>${fmt(p.price)}</i></span></span></span>`;
    field.appendChild(b); b._p = p; return b;
  });

  let drags = [];
  function layout() {
    const m = matchMedia(STACK).matches, L = m ? MOB : DESK;
    els.forEach(b => {
      const [x, y, r, w, d, lr] = L[b._p.id];
      b.style.left = x + '%'; b.style.top = y + '%'; b.style.width = `min(${w}vw, ${m ? 300 : 420}px)`;
      if (innerWidth >= 1800 && !m) b.style.width = w + 'vw';
      b._depth = d; b._rot = r;
      b.querySelector('.tilt').style.transform = `rotate(${r}deg)`;
      b.querySelector('.label').style.setProperty('--lr', lr + 'deg');
      b.style.zIndex = Math.round(d * 10);
      gsap.set(b, { x: 0, y: 0 });
    });
  }
  layout();
  addEventListener('resize', () => { layout(); ScrollTrigger.refresh(); });

  /* hover: straighten */
  els.forEach(b => {
    const t = b.querySelector('.tilt');
    const on = () => { t.style.transform = `rotate(${b._rot * 0.15}deg) scale(1.06)`; };
    const off = () => { t.style.transform = `rotate(${b._rot}deg)`; };
    b.addEventListener('pointerenter', on); b.addEventListener('pointerleave', off);
    b.addEventListener('focus', on); b.addEventListener('blur', off);
  });

  /* float */
  if (!reduce) els.forEach((b, i) => {
    const f = b.querySelector('.float');
    gsap.to(f, { y: gsap.utils.random(-22, -10), rotation: gsap.utils.random(-4, 4), duration: gsap.utils.random(2.4, 3.6), ease: 'sine.inOut', yoyo: true, repeat: -1, delay: i * .2 });
  });

  /* drag (pointer) — click without drag opens the product */
  let topZ = 50;
  els.forEach(b => {
    const d = window.Draggable.create(b, {
      type: 'x,y', bounds: field, edgeResistance: .65, zIndexBoost: false,
      onPress() { b.style.zIndex = ++topZ; gsap.to(b.querySelector('.tilt'), { scale: 1.1, duration: .3 }); },
      onRelease() { gsap.to(b.querySelector('.tilt'), { scale: 1, duration: .5, ease: 'back.out(3)' }); },
      onDrag() { gsap.to(b.querySelector('.float'), { rotation: gsap.utils.clamp(-25, 25, this.deltaX * 1.5), duration: .3 }); },
      onDragEnd() { gsap.to(b.querySelector('.float'), { rotation: 0, duration: 1, ease: 'elastic.out(1,.4)' }); },
      onClick() { openProduct(b._p); }
    })[0];
    drags.push(d);
    b.addEventListener('click', e => { if (e.detail === 0) openProduct(b._p); }); // keyboard
  });

  /* mouse parallax */
  let mx = 0, my = 0;
  addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; }, { passive: true });
  if (!reduce) gsap.ticker.add(() => {
    els.forEach(b => {
      b.firstChild.style.translate = `${-mx * 40 * b._depth}px ${-my * 30 * b._depth}px`;
    });
  });

  /* scroll parallax on mobile (tall field) */
  els.forEach(b => {
    gsap.to(b.firstChild, { yPercent: () => matchMedia(STACK).matches ? -40 * b._depth : 0, ease: 'none', scrollTrigger: { trigger: field, start: 'top top', end: 'bottom bottom', scrub: true, invalidateOnRefresh: true } });
  });
  gsap.to('#mq1', { xPercent: -30, ease: 'none', duration: 40, repeat: -1, yoyo: true });
  gsap.fromTo('#mq2', { xPercent: -30 }, { xPercent: 0, ease: 'none', duration: 46, repeat: -1, yoyo: true });

  /* intro animation */
  const h = document.querySelector('.split');
  h.innerHTML = h.textContent.trim().split(/\s+/).map(w => `<span class="w"><span>${w}</span></span>`).join(' ');
  const tl = gsap.timeline({ delay: .2 });
  tl.from('.eyebrow', { y: 20, autoAlpha: 0, duration: .6, ease: 'power3.out' })
    .from('.split .w>span', { yPercent: 115, rotate: 6, duration: 1, ease: 'expo.out', stagger: .08 }, '-=.3')
    .from('.hint', { y: 20, autoAlpha: 0, duration: .7 }, '-=.6')
    .from(els, { y: () => -innerHeight * 1.1, rotation: () => gsap.utils.random(-60, 60), duration: 1.4, ease: 'bounce.out', stagger: { each: .12, from: 'random' } }, '-=1');

  /* ---------- cart ---------- */
  let cart = {};
  try { cart = JSON.parse(localStorage.getItem('echips-cart') || '{}') || {}; } catch (e) { cart = {}; }
  const save = () => { try { localStorage.setItem('echips-cart', JSON.stringify(cart)); } catch (e) {} };
  const countEl = document.getElementById('count');
  const totalQty = () => Object.values(cart).reduce((a, b) => a + b, 0);
  const totalPrice = () => Object.entries(cart).reduce((a, [id, q]) => a + q * P.find(p => p.id === id).price, 0);
  function refreshCount(bump) {
    countEl.textContent = totalQty();
    if (bump) gsap.fromTo('#openCart', { scale: 1.25, rotation: -8 }, { scale: 1, rotation: 0, duration: .7, ease: 'elastic.out(1,.4)' });
  }
  refreshCount();

  const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
  const body = document.getElementById('dBody'), foot = document.getElementById('dFoot'), title = document.getElementById('dTitle');
  let lastFocus = null;
  function open() { lastFocus = document.activeElement; drawer.classList.add('on'); scrim.classList.add('on'); setTimeout(() => document.getElementById('close').focus(), 50); }
  function close() { drawer.classList.remove('on'); scrim.classList.remove('on'); if (lastFocus) lastFocus.focus(); }
  document.getElementById('close').onclick = close; scrim.onclick = close;
  addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('on')) close(); });

  function openProduct(p) {
    let q = 1;
    title.textContent = 'Commander';
    body.innerHTML = `<div class="pv"><div class="stage" style="background:${p.bg}"><img alt="${p.name}" src="${p.img}"></div>
      <h3>${p.name}</h3><p class="fmt">${p.pack}</p><p class="price">${fmt(p.price)}</p>
      <div class="qty" role="group" aria-label="Quantité"><button type="button" data-d="-1" aria-label="Retirer un lot">−</button><output id="q">1</output><button type="button" data-d="1" aria-label="Ajouter un lot">+</button></div></div>`;
    foot.innerHTML = `<div class="total"><span>Sous-total</span><b id="st">${fmt(p.price)}</b></div>
      <button class="btn" id="add" type="button">Ajouter au panier</button>`;
    body.querySelectorAll('[data-d]').forEach(btn => btn.onclick = () => {
      q = Math.max(1, q + +btn.dataset.d); body.querySelector('#q').textContent = q; foot.querySelector('#st').textContent = fmt(q * p.price);
    });
    foot.querySelector('#add').onclick = () => {
      cart[p.id] = (cart[p.id] || 0) + q; save(); refreshCount(true); close(); toast(`${q} × ${p.name} ajouté au panier`);
    };
    open();
    gsap.from(body.querySelector('.stage img'), { y: 80, rotation: 20, scale: .7, duration: 1, ease: 'elastic.out(1,.6)', delay: .15 });
  }

  /* ---------- commande : coordonnées + livraison + paiement Paystack ---------- */
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function openCheckout() {
    let saved = {}; try { saved = JSON.parse(localStorage.getItem('echips-customer') || '{}') || {}; } catch (e) {}
    const geo = (window.eChipsGeo && window.eChipsGeo.get()) || null;
    title.textContent = 'Ta commande';
    const lines = Object.keys(cart).filter(id => cart[id] > 0).map(id => { const p = P.find(x => x.id === id); return `<li><span>${cart[id]} × ${esc(p.name)}</span><b>${fmt(cart[id] * p.price)}</b></li>`; }).join('');
    body.innerHTML = `<form id="ck" class="ck" novalidate autocomplete="on">
      <label class="f"><span>Nom complet</span><input name="name" id="ckName" type="text" autocomplete="name" placeholder="Ex : Aïcha Koné" value="${esc(saved.name || '')}" required></label>
      <label class="f"><span>Numéro WhatsApp</span><input name="whatsapp" id="ckWa" type="tel" inputmode="tel" autocomplete="tel" placeholder="+225 05 00 00 00 00" value="${esc(saved.whatsapp || '')}" required></label>
      <div class="f"><span>Lieu de livraison</span>
        <div class="locrow"><input name="address" id="ckAddr" type="text" autocomplete="street-address" placeholder="Quartier, ville, repère…" value="${esc(saved.address || (geo && geo.label) || '')}" required>
          <button type="button" class="locbtn" id="ckLoc" aria-label="Utiliser ma position actuelle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button></div>
        <small class="hint2" id="ckGeoMsg"></small>
      </div>
      <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
      <ul class="sum">${lines}</ul>
      <p class="err" id="ckErr" role="alert" hidden></p>
    </form>`;
    foot.innerHTML = `<div class="total"><span>Total</span><b>${fmt(totalPrice())}</b></div>
      <button class="btn" type="button" id="pay">Payer avec Paystack</button>
      <button class="btn ghost" type="button" id="backCart">← Retour au panier</button>
      <p class="note">Paiement sécurisé par Paystack (Mobile Money, carte). Aucune donnée bancaire ne passe par ce site.</p>`;
    const f = body.querySelector('#ck'), addr = f.querySelector('#ckAddr'), msg = f.querySelector('#ckGeoMsg'), err = f.querySelector('#ckErr');
    let pos = geo && geo.lat ? { lat: geo.lat, lng: geo.lng } : null, auto = !saved.address && !!(geo && geo.label);
    const setMsg = t => { msg.textContent = t; };
    setMsg(auto ? '📍 Position détectée — tu peux la modifier.' : (pos ? '' : 'Active la localisation pour pré-remplir, ou écris ton adresse.'));
    addr.addEventListener('input', () => { auto = false; setMsg(''); });
    const useGeo = force => {
      if (!window.eChipsGeo) return;
      setMsg('Localisation en cours…');
      window.eChipsGeo.locate(force).then(g => {
        const denied = window.eChipsGeo.error() === 1;
        if (g && g.label && !g.approx) { addr.value = g.label; pos = { lat: g.lat, lng: g.lng }; auto = true; setMsg('📍 Position détectée — tu peux la modifier.'); }
        else if (g && g.label) { if (!addr.value.trim()) addr.value = g.label; pos = { lat: g.lat, lng: g.lng }; setMsg((denied ? 'Localisation précise refusée. ' : '') + '📍 Position approximative : ajoute ton quartier / repère.'); }
        else if (g && g.lat) { pos = { lat: g.lat, lng: g.lng }; setMsg('Position trouvée, précise ton quartier ci-dessus.'); }
        else setMsg(denied ? "Localisation refusée : autorise-la dans les réglages du navigateur (Réglages › Safari › Localisation sur iPhone), ou écris ton adresse." : 'Impossible de te localiser : écris ton adresse.');
      });
    };
    f.querySelector('#ckLoc').onclick = () => useGeo(true);
    if (!addr.value) useGeo(false);
    foot.querySelector('#backCart').onclick = openCart;
    const payBtn = foot.querySelector('#pay');
    const fail = (t, el) => { err.textContent = t; err.hidden = false; if (el) el.focus(); };
    payBtn.onclick = async () => {
      err.hidden = true;
      const name = f.name.value.trim(), wa = f.whatsapp.value.trim(), ad = addr.value.trim();
      if (name.length < 2) return fail('Indique ton nom.', f.name);
      if (!/^\+?\d{8,15}$/.test(wa.replace(/[\s.()-]/g, ''))) return fail('Numéro WhatsApp invalide (ex : +225 05 00 23 40 40).', f.whatsapp);
      if (ad.length < 3) return fail('Indique ton lieu de livraison.', addr);
      try { localStorage.setItem('echips-customer', JSON.stringify({ name, whatsapp: wa, address: ad })); } catch (e) {}
      payBtn.disabled = true; payBtn.textContent = 'Redirection vers Paystack…';
      try {
        const r = await fetch('api/init.php', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, whatsapp: wa, address: ad, lat: pos && pos.lat, lng: pos && pos.lng, website: f.website.value, items: cart }) });
        let j = null; try { j = await r.json(); } catch (e) {}
        if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || (r.status === 404 || r.status === 501 ? "Le paiement n'est pas disponible sur ce serveur (il faut PHP, voir README)." : 'Erreur serveur, réessaie.'));
        location.href = j.url;
      } catch (e) {
        payBtn.disabled = false; payBtn.textContent = 'Payer avec Paystack';
        fail(e.message || 'Connexion impossible, réessaie.');
      }
    };
    if (!drawer.classList.contains('on')) open();
  }

  function openCart() {
    title.textContent = 'Ton panier';
    const ids = Object.keys(cart).filter(id => cart[id] > 0);
    if (!ids.length) {
      body.innerHTML = `<p class="empty">Ton panier est vide.<br>Attrape un sachet pour commencer.</p>`;
      foot.innerHTML = `<button class="btn" type="button" id="back">Voir les produits</button>`;
      foot.querySelector('#back').onclick = close;
    } else {
      body.innerHTML = ids.map(id => { const p = P.find(x => x.id === id); return `<div class="line"><img alt="" src="${p.img}"><div class="info"><b>${p.name}</b><span>${p.pack} · ${fmt(p.price)}</span></div>
        <div class="qty"><button type="button" data-id="${id}" data-d="-1" aria-label="Retirer un lot de ${p.name}">−</button><output>${cart[id]}</output><button type="button" data-id="${id}" data-d="1" aria-label="Ajouter un lot de ${p.name}">+</button></div></div>`; }).join('');
      foot.innerHTML = `<div class="total"><span>Total</span><b>${fmt(totalPrice())}</b></div>
        <button class="btn" type="button" id="go">Passer la commande</button>
        <a class="btn ghost" id="wa" href="#">Commander sur WhatsApp</a>
        <p class="note">Livraison confirmée par téléphone ou WhatsApp au ${PHONE}.</p>`;
      foot.querySelector('#go').onclick = openCheckout;
      body.querySelectorAll('[data-d]').forEach(btn => btn.onclick = () => {
        cart[btn.dataset.id] = Math.max(0, cart[btn.dataset.id] + +btn.dataset.d);
        if (!cart[btn.dataset.id]) delete cart[btn.dataset.id];
        save(); refreshCount(); openCart();
      });
      const msg = 'Bonjour e-CHIPS, je souhaite commander :\n' + ids.map(id => { const p = P.find(x => x.id === id); return `- ${cart[id]} × ${p.name} (${p.pack}) = ${fmt(cart[id] * p.price)}`; }).join('\n') + `\nTotal : ${fmt(totalPrice())}`;
      foot.querySelector('#wa').href = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
    }
    if (!drawer.classList.contains('on')) open();
  }
  document.getElementById('openCart').onclick = openCart;

  const t = document.getElementById('toast'); let tt;
  function toast(s) { t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
})();
</script>

const chipSide = new THREE.MeshStandardMaterial({ color: 0xC98A2B, roughness: .7 });
const tl = new THREE.TextureLoader();

const chips = [];
const CN = (innerWidth < 820 || matchMedia('(pointer:coarse)').matches) ? 16 : 30;

  m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);

let mx = 0, my = 0; addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; }, { passive: true });

size(); addEventListener('resize', size);
const clock = new THREE.Clock();
(function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
